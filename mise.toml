min_version = "2026.10.17"

[tools]
bun = '1.4.4'
biome = '2.5.15'
lefthook = "2.0.15"
"github:convco/convco" = "0.6.2"
# Its release assets are named after the platform alone (`linux-amd64`), so the
# binary has to be renamed explicitly.
"github:github/gh-actions-lock" = { version = "0.4.1", bin = "gh-actions-lock" }

[hooks]
postinstall = "lefthook install"

[tasks.check]
depends = ['check:format', 'check:lint', 'check:type']

[tasks.'check:format']
run = 'bun fmt --check'

[tasks.'check:lint']
run = 'biome lint --error-on-warnings'

[tasks.'check:type']
run = 'bun check'

# `--bun` keeps Vitest on Bun: under Node the `Bun` global the sources use is
# undefined.
[tasks.test]
description = 'Run the unit and integration tests'
run = 'bun --bun vitest run'

[tasks.'test:watch']
description = 'Run the unit and integration tests in watch mode'
run = 'bun --bun vitest'

[tasks.build]
description = 'Compile wk for a Bun target (e.g. bun-linux-x64) into dist/wk'
usage = 'arg "<target>"'
run = '''
bun build --compile --minify --target="${usage_target:?}" \
  --define BUILD_VERSION="\"${BUILD_VERSION:-unknown}\"" \
  --define BUILD_TIME="\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"" \
  --outfile dist/wk src/wk.ts
'''

[tasks.'generate:schemas']
description = 'Generate the distributable JSON Schemas from src/schema.ts'
run = 'bun scripts/generate-schemas.ts'

[tasks.dist]
description = 'Package dist/wk with its schemas and LICENSE into dist/<name>.tar.gz'
usage = 'arg "<name>"'
depends = 'generate:schemas'
run = [
  'mkdir -p "dist/${usage_name:?}"',
  'cp dist/wk LICENSE "dist/${usage_name:?}/"',
  'cp -R dist/schemas "dist/${usage_name:?}/"',
  'tar -czf "dist/${usage_name:?}.tar.gz" -C dist "${usage_name:?}"',
  'rm -r "dist/${usage_name:?}"',
]

[tasks.e2e]
description = 'Build the binary for WK_E2E_TARGET and run the e2e suite'
run = [
  'mise run build "${WK_E2E_TARGET:-bun-linux-x64}"',
  './e2e/run.sh',
]

[tasks.'e2e:only']
description = 'Run the e2e suite against the binary already in dist/'
run = './e2e/run.sh'

[tasks."gha:lint"]
tools.actionlint = "1.7.10"
tools.ghalint = "1.6.0"
run = [
  "actionlint",
  "ghalint run",
  "ghalint run-action",
  "gh-actions-lock --verify-local",
]

[tasks."gha:lock"]
description = 'Regenerate .github/workflows/actions.lock from the uses: references'
run = "gh-actions-lock"

[tasks."gha:verify"]
description = 'Check actions.lock against the workflows and the upstream repositories'
run = "gh-actions-lock --verify"
