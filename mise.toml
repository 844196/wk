[tools]
deno = '2.4.2'

[tasks.check]
depends = ['check:format', 'check:lint', 'check:type']

[tasks.'check:format']
run = 'deno fmt --check'

[tasks.'check:lint']
run = 'deno lint'

[tasks.'check:type']
depends = 'generate:version'
run = 'deno check src/cli.ts'

[tasks.'generate:version']
run = 'echo "${VERSION:-unknown}" > VERSION'

[tasks.build]
depends = [
  'build:internal x86_64-unknown-linux-gnu',
  'build:internal aarch64-unknown-linux-gnu',
  'build:internal x86_64-apple-darwin',
  'build:internal aarch64-apple-darwin',
  'build:internal x86_64-pc-windows-msvc',
]

[tasks.'build:internal']
depends = 'bundle'
run = 'deno compile --allow-all --target {{arg(name="target")}} --output dist/wk-{{arg(name="target")}} dist/wk.js'
hide = true

[tasks.bundle]
depends = 'generate:version'
run = 'deno bundle --minify --output dist/wk.js src/cli.ts'
