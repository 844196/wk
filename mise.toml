[tools]
deno = '2.5.2'

[tasks.check]
depends = ['check:format', 'check:lint', 'check:type']

[tasks.'check:format']
run = 'deno fmt --check'

[tasks.'check:lint']
run = 'deno lint'

[tasks.'check:type']
depends = 'generate:version'
run = 'deno check src/wk.ts'

[tasks.'generate:version']
run = 'echo "${VERSION:-unknown}" > VERSION'

[tasks.build]
depends = [
  'build:internal x86_64-unknown-linux-gnu',
  'build:internal aarch64-unknown-linux-gnu',
  'build:internal x86_64-apple-darwin',
  'build:internal aarch64-apple-darwin',
]

[tasks.'build:internal']
depends = 'bundle'
run = 'deno compile --allow-all --target {{arg(name="target")}} --output dist/wk-{{arg(name="target")}} dist/wk.bundle.js'
hide = true

[tasks.bundle]
depends = 'generate:version'
run = 'deno bundle --minify --output dist/wk.bundle.js src/wk.ts'

[tasks."gha:lint"]
tools.actionlint = "1.7.10"
tools.ghalint = "1.5.4"
run = ["actionlint", "ghalint run"]

[tasks."gha:pin"]
tools.pinact = "4.1.1"
run = ["pinact run --fix"]
