[tools]
bun = '1.4.3'
biome = '2.5.15'
lefthook = "2.0.15"
"github:convco/convco" = "0.6.2"

[hooks]
postinstall = "lefthook install"

[tasks.check]
depends = ['check:format', 'check:lint', 'check:type']

[tasks.'check:format']
run = 'biome format'

[tasks.'check:lint']
run = 'biome lint --error-on-warnings'

[tasks.'check:type']
run = 'bun run tsc'

[tasks.build]
description = 'Compile wk for a Bun target (e.g. bun-linux-x64) into dist/wk'
usage = 'arg "<target>"'
run = '''
bun build --compile --minify --target="${usage_target:?}" \
  --define WK_VERSION="\"${VERSION:-unknown}\"" \
  --outfile dist/wk src/wk.ts
'''

[tasks.'generate:schemas']
description = 'Generate the distributable JSON Schemas from src/schema.ts'
run = 'bun scripts/generate-schemas.ts'

[tasks.dist]
description = 'Package dist/wk with its schemas and LICENSE into dist/<name>.tar.gz'
usage = 'arg "<name>"'
depends = 'generate:schemas'
run = [
  'mkdir -p "dist/${usage_name:?}"',
  'cp dist/wk LICENSE "dist/${usage_name:?}/"',
  'cp -R dist/schemas "dist/${usage_name:?}/"',
  'tar -czf "dist/${usage_name:?}.tar.gz" -C dist "${usage_name:?}"',
  'rm -r "dist/${usage_name:?}"',
]

[tasks.e2e]
description = 'Build the binary for WK_E2E_TARGET and run the e2e suite'
run = [
  'mise run build "${WK_E2E_TARGET:-bun-linux-x64}"',
  './e2e/run.sh',
]

[tasks.'e2e:only']
description = 'Run the e2e suite against the binary already in dist/'
run = './e2e/run.sh'

[tasks."gha:lint"]
tools.actionlint = "1.7.10"
tools.ghalint = "1.5.4"
run = ["actionlint", "ghalint run"]

[tasks."gha:pin"]
tools.pinact = "4.1.1"
run = ["pinact run --fix"]
