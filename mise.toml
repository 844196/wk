[tools]
bun = '1.4.3'
biome = '2.5.15'
lefthook = "2.0.15"
"github:convco/convco" = "0.6.2"

[hooks]
postinstall = "lefthook install"

[tasks.check]
depends = ['check:format', 'check:lint', 'check:type']

[tasks.'check:format']
run = 'biome format'

[tasks.'check:lint']
run = 'biome lint --error-on-warnings'

[tasks.'check:type']
depends = 'generate:version'
run = 'bun run tsc'

[tasks.'generate:version']
run = 'echo "${VERSION:-unknown}" > VERSION'

[tasks.build]
depends = [
  'build:internal x86_64-unknown-linux-gnu',
  'build:internal aarch64-unknown-linux-gnu',
  'build:internal x86_64-apple-darwin',
  'build:internal aarch64-apple-darwin',
]

[tasks.'build:internal']
depends = 'generate:version'
run = '''
set -eu
target='{{arg(name="target")}}'
case "${target}" in
  x86_64-unknown-linux-gnu) bun_target=bun-linux-x64 ;;
  aarch64-unknown-linux-gnu) bun_target=bun-linux-arm64 ;;
  x86_64-apple-darwin) bun_target=bun-darwin-x64 ;;
  aarch64-apple-darwin) bun_target=bun-darwin-arm64 ;;
  *) echo "unknown target: ${target}" >&2; exit 1 ;;
esac
bun build --compile --minify --target="${bun_target}" --outfile "dist/wk-${target}" src/wk.ts
'''
hide = true

[tasks.'generate:schemas']
description = 'Generate the distributable JSON Schemas from src/schema.ts'
run = 'bun scripts/generate-schemas.ts'

[tasks.dist]
description = 'Package a target into dist/wk-<target>.tar.gz with its schemas and LICENSE'
depends = 'generate:schemas'
run = '''
set -eu
target='{{arg(name="target")}}'
mise run build:internal "${target}"
stage="dist/pkg/wk-${target}"
rm -rf "${stage}"
mkdir -p "${stage}"
cp "dist/wk-${target}" "${stage}/wk"
cp LICENSE "${stage}/"
cp -R dist/schemas "${stage}/schemas"
tar -czf "dist/wk-${target}.tar.gz" -C dist/pkg "wk-${target}"
rm -rf dist/pkg
'''

[tasks.e2e]
description = 'Build the binary for WK_E2E_TARGET and run the e2e suite'
run = [
  'mise run build:internal "${WK_E2E_TARGET:-x86_64-unknown-linux-gnu}"',
  './e2e/run.sh',
]

[tasks.'e2e:only']
description = 'Run the e2e suite against the binary already in dist/'
run = './e2e/run.sh'

[tasks."gha:lint"]
tools.actionlint = "1.7.10"
tools.ghalint = "1.5.4"
run = ["actionlint", "ghalint run"]

[tasks."gha:pin"]
tools.pinact = "4.1.1"
run = ["pinact run --fix"]
