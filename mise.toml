[tools]
deno = '2.5.2'
lefthook = "2.0.15"
"github:convco/convco" = "0.6.2"

[hooks]
postinstall = "lefthook install"

[tasks.check]
depends = ['check:format', 'check:lint', 'check:type']

[tasks.'check:format']
run = 'deno fmt --check'

[tasks.'check:lint']
run = 'deno lint'

[tasks.'check:type']
depends = 'generate:version'
run = 'deno check src/wk.ts'

[tasks.'generate:version']
run = 'echo "${VERSION:-unknown}" > VERSION'

[tasks.build]
depends = [
  'build:internal x86_64-unknown-linux-gnu',
  'build:internal aarch64-unknown-linux-gnu',
  'build:internal x86_64-apple-darwin',
  'build:internal aarch64-apple-darwin',
]

[tasks.'build:internal']
depends = 'bundle'
run = 'deno compile --allow-all --target {{arg(name="target")}} --output dist/wk-{{arg(name="target")}} dist/wk.bundle.js'
hide = true

[tasks.bundle]
depends = 'generate:version'
run = 'deno bundle --minify --output dist/wk.bundle.js src/wk.ts'

[tasks.e2e]
description = 'Build the binary for WK_E2E_TARGET and run the e2e suite'
run = [
  'mise run build:internal "${WK_E2E_TARGET:-x86_64-unknown-linux-gnu}"',
  './e2e/run.sh',
]

[tasks.'e2e:only']
description = 'Run the e2e suite against the binary already in dist/'
run = './e2e/run.sh'

[tasks."gha:lint"]
tools.actionlint = "1.7.10"
tools.ghalint = "1.5.4"
run = ["actionlint", "ghalint run"]

[tasks."gha:pin"]
tools.pinact = "4.1.1"
run = ["pinact run --fix"]
