name: Lockfile

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The actions only release.yaml uses don't run until a tag is pushed, so a bad pin for one of them
  # has to be caught here rather than by the runner.
  # The schedule catches pins that go stale when a tag or commit moves or disappears upstream.
  lockfile:
    name: Lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project

      - name: Run verify
        run: mise run gha:verify
        env:
          GH_TOKEN: ${{ github.token }}
