name: Release
run-name: 'Release (${{ github.ref_name }})'

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Run build
        run: mise run build bun-${{ matrix.platform }}
        env:
          BUILD_VERSION: ${{ github.ref_name }}

      - name: Make tarball
        run: mise run dist wk-${{ matrix.platform }}

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball-${{ matrix.platform }}
          path: dist/wk-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  release-notes:
    name: Release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Generate release notes
        run: convco changelog ${{ github.ref_name }} --max-versions 1 -o release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs:
      - build
      - release-notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes

      - name: Create draft release
        run: >-
          gh release create ${{ github.ref_name }} dist/wk-*.tar.gz --repo ${{ github.repository }} --draft
          ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
          --title ${{ github.ref_name }} --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Sign release with packslip
        uses: jdx/packslip@0e9bde4ea49070555a79cac1f040f1dafe60acd6 # v1.8.0
        with:
          artifacts: dist/wk-*.tar.gz
          bin: wk
