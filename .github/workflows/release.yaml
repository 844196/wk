name: Release
run-name: 'Release (${{ github.ref_name }})'

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project

      - name: Run build
        run: mise run build bun-${{ matrix.platform }}
        env:
          BUILD_VERSION: ${{ github.ref_name }}

      - name: Make tarball
        run: mise run dist wk-${{ matrix.platform }}

      - name: Upload tarball
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tarball-${{ matrix.platform }}
          path: dist/wk-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  release-notes:
    name: Release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project

      - name: Generate release notes
        # GitHub shows every newline in release notes as a line break, and convco keeps the newlines of
        # a wrapped BREAKING CHANGE footer. Its templates have no helper to replace them, so join each
        # list item's continuation lines here.
        run: >-
          convco changelog ${{ github.ref_name }} --max-versions 1
          | awk '/^\* /{if(b!="")print b;b=$0;next} b!=""&&NF&&!/^#/{b=b" "$0;next} {if(b!=""){print b;b=""};print} END{if(b!="")print b}'
          > release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs:
      - build
      - release-notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download tarballs
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-notes

      - name: Create draft release
        run: >-
          gh release create ${{ github.ref_name }} dist/wk-*.tar.gz --repo ${{ github.repository }} --draft
          ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
          --title ${{ github.ref_name }} --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Sign release with packslip
        uses: jdx/packslip@v1.8.0
        with:
          artifacts: dist/wk-*.tar.gz
          bin: wk
